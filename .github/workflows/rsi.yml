name: Alerta RSI

on:
  schedule:
    # Cada 5 minutos (minutos 3, 8, 13...), asi hay mas chances de revisar justo despues del cierre de cada vela
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar notificación de prueba"
        type: boolean
        default: true
      lookback:
        description: "Velas a revisar (normal: 4. Para probar 24 horas: 96)"
        type: string
        default: "4"

permissions:
  contents: write

concurrency:
  group: alerta-rsi
  cancel-in-progress: false

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Revisar RSI
        env:
          SIMBOLOS: "RAYUSDT,RENDERUSDT,BTCUSDT"
          TIMEFRAME: "15m"
          LOOKBACK: ${{ github.event.inputs.lookback || '4' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRUEBA: ${{ github.event.inputs.prueba || 'false' }}
        run: python alerta_rsi_nube.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add estado.json || true
          git diff --cached --quiet || (git commit -m "actualizar estado" && git push)
